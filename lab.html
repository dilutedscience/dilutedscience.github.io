<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BBD Mix Studio Lights</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Arial', sans-serif;
      background: #000;
      color: #fff;
    }
    
    .container {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    
    .background {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.7) contrast(1.1);
      z-index: 1;
    }
    
    .overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(100,0,200,0.3), rgba(0,0,0,0.6));
      z-index: 2;
    }
    
    .content {
      position: relative;
      z-index: 3;
      text-align: center;
      padding: 20px;
      max-width: 90%;
    }
    
    h1 {
      font-size: 4.5rem;
      margin: 0.2em 0;
      text-shadow: 0 0 20px #ff00ff, 0 0 40px #00ffff;
      letter-spacing: 4px;
      animation: glow 3s infinite alternate;
    }
    
    p {
      font-size: 1.6rem;
      margin: 0.5em 0;
      text-shadow: 0 0 10px #fff;
    }
    
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      margin-top: 30px;
    }
    
    .gallery img {
      width: 380px;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.6), 0 0 60px rgba(255, 0, 255, 0.4);
      transition: transform 0.4s, box-shadow 0.4s;
    }
    
    .gallery img:hover {
      transform: scale(1.08);
      box-shadow: 0 0 50px rgba(0, 255, 255, 0.9), 0 0 100px rgba(255, 0, 255, 0.7);
    }
    
    @keyframes glow {
      from { text-shadow: 0 0 10px #ff00ff, 0 0 20px #00ffff; }
      to   { text-shadow: 0 0 30px #ff00ff, 0 0 60px #00ffff, 0 0 90px #ff00ff; }
    }
    
    @media (max-width: 900px) {
      h1 { font-size: 3.2rem; }
      .gallery img { width: 320px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://thumbs.dreamstime.com/b/dj-equipment-setup-stage-vibrant-lighting-entertainment-music-438179330.jpg" 
         alt="Vibrant DJ setup with colorful stage lights" class="background">
    
    <div class="overlay"></div>
    
    <div class="content">
      <h1>BBD MIX</h1>
      <p>Studio Session • Lights On • Pure Energy</p>
      
      <div class="gallery">
        <img src="BBD mix.jpg" 
             alt="Neon DJ mixer with glowing colorful lights">
        
        <img src="studio.jpg" 
             alt="Futuristic neon DJ studio with vibrant lights">
        
        <img src="lights.jpg" 
             alt="DJ controller with glowing waveform and lights">
        
        <img src="https://thumbs.dreamstime.com/b/mixer-section-dj-controller-dark-dj-room-downtown-party-mixer-section-dj-controller-dark-dj-room-downtown-party-181115380.jpg" 
             alt="Close-up DJ mixer with purple, blue, and red illuminated controls">
      </div>
    </div>
  </div>
</body>
</html>

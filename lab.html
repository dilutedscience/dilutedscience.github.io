<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BBD Mix</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background-color: #111;
      color: #eee;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    
    h1 {
      margin: 20px 0;
      font-size: 2.8rem;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255, 80, 150, 0.7);
    }
    
    .image-container {
      max-width: 90%;
      max-height: 70vh;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
      border: 2px solid #333;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }
    
    img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }
    
    footer {
      margin-top: 30px;
      font-size: 0.9rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <h1>BBD MIX</h1>
  
  <div class="image-container">
    <!-- Replace this src with your actual BBD mix image URL -->
    <img src="BBD mix.jpg" 
         alt="BBD Mix Artwork / Cover">
  </div>

  <footer>
    Created for @dilutedscience • February 2026
  </footer>

</body>
</html>

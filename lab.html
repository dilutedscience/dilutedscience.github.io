<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BBD Mix & Studio Vibes</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #111;
      color: #eee;
      text-align: center;
    }
    h1 {
      margin-bottom: 30px;
      color: #ffcc00;
      text-shadow: 0 0 10px #ffcc00;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .image-card {
      flex: 1;
      min-width: 300px;
      max-width: 600px;
      background: #222;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    .image-card h2 {
      margin: 10px 0;
      color: #00ccff;
    }
    img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      border: 2px solid #444;
    }
    footer {
      margin-top: 40px;
      font-size: 0.9em;
      color: #888;
    }
  </style>
</head>
<body>

  <h1>BBD Mix × Studio Energy</h1>

  <div class="container">
    <div class="image-card">
      <h2>BBD Mix (WBBD Bootcity! Remix Album Art)</h2>
      <img src="BBD mix.jpg" 
           alt="Bell Biv DeVoe WBBD Bootcity The Remix Album cover art">
    </div>

    <div class="image-card">
      <h2>Recording Studio Mixing Console</h2>
      <img src="studio.jpg" 
           alt="Professional music recording studio mixing desk">
    </div>
  </div>

  <footer>
    <p>Classic BBD vibes meet that mixing board magic • 1990s New Jack Swing forever</p>
  </footer>

</body>
</html>

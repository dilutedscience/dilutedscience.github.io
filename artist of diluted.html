<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Diluted Science Artists</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f0f0f;
      color: #e0e0e0;
    }
    header {
      background: linear-gradient(to right, #1a1a2e, #16213e);
      padding: 60px 20px;
      text-align: center;
      border-bottom: 4px solid #00d4ff;
    }
    header h1 {
      margin: 0;
      font-size: 3.2rem;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    header p {
      margin: 10px 0 0;
      font-size: 1.3rem;
      opacity: 0.9;
    }
    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
    }
    .artist-card {
      background: #1e1e2e;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      text-align: center;
    }
    .artist-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 15px 35px rgba(0, 212, 255, 0.3);
    }
    .artist-card img {
      width: 100%;
      height: 420px;
      object-fit: cover;
      display: block;
      cursor: pointer; /* Makes it clear the image is clickable */
    }
    .artist-card h2 {
      margin: 35px 15px 30px;
      font-size: 1.6rem;
      color: #00d4ff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    footer {
      text-align: center;
      padding: 30px;
      background: #0a0a0a;
      font-size: 0.95rem;
      opacity: 0.7;
    }

    /* ==================== MODAL STYLES ==================== */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 15, 15, 0.95);
      z-index: 10000;
      justify-content: center;
      align-items: center;
      overflow: auto;
    }
    .modal-content {
      position: relative;
      max-width: 90%;
      max-height: 90vh;
      text-align: center;
      background: #1e1e2e;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 212, 255, 0.4);
    }
    #modal-image {
      max-width: 100%;
      max-height: 75vh;
      object-fit: contain;
      border-radius: 8px;
      margin-bottom: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }
    #modal-artist {
      color: #00d4ff;
      font-size: 1.8rem;
      margin: 10px 0 0;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .close {
      position: absolute;
      top: -18px;
      right: -18px;
      color: #00d4ff;
      font-size: 3rem;
      font-weight: bold;
      cursor: pointer;
      z-index: 10001;
      transition: color 0.2s ease;
    }
    .close:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <header>
    <h1>Diluted Science</h1>
    <p>Collective of visionary artists pushing boundaries</p>
  </header>

  <div class="container">
    <div class="gallery">

      <div class="artist-card">
        <img src="BBD.jpg" alt="BBD">
        <h2>BBD</h2>
      </div>

      <div class="artist-card">
        <img src="andy b.jpg" alt="Andy B">
        <h2>Andy B</h2>
      </div>

      <div class="artist-card">
        <img src="west bird.jpg" alt="West Bird">
        <h2>West Bird</h2>
      </div>

      <div class="artist-card">
        <img src="Adam.png" alt="Adam">
        <h2>Adam</h2>
      </div>

      <div class="artist-card">
        <img src="george w.jpg" alt="George Winters">
        <h2>George Winters</h2>
      </div>

      <div class="artist-card">
        <img src="Q.jpg" alt="Q">
        <h2>Q</h2>
      </div>

      <div class="artist-card">
        <img src="TONE.png" alt="TONE">
        <h2>TONE</h2>
      </div>

      <div class="artist-card">
        <img src="JACK.png" alt="JACK">
        <h2>JACK</h2>
      </div>

      <div class="artist-card">
        <img src="CXLXRADX.jpg" alt="CXLXRADX">
        <h2>CXLXRADX</h2>
      </div>

    </div>
  </div>

  <footer>
    © 2011 Diluted Science • <a href="https://x.com/dilutedscience" style="color: #00d4ff; text-decoration: none;">@dilutedscience</a>
  </footer>

  <!-- ==================== MODAL ==================== -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close" id="close-btn">&times;</span>
      <img id="modal-image" src="" alt="">
      <h2 id="modal-artist"></h2>
    </div>
  </div>

  <script>
    // Get modal elements
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modal-image');
    const modalArtist = document.getElementById('modal-artist');
    const closeBtn = document.getElementById('close-btn');

    // Select all artist images
    const images = document.querySelectorAll('.artist-card img');

    images.forEach(img => {
      img.addEventListener('click', function () {
        // Find the artist name from the card
        const card = this.closest('.artist-card');
        const artistName = card.querySelector('h2').textContent;

        // Open modal
        modal.style.display = 'flex';
        modalImg.src = this.src;
        modalImg.alt = this.alt;
        modalArtist.textContent = artistName;

        // Prevent body scroll while modal is open
        document.body.style.overflow = 'hidden';
      });
    });

    // Close modal when clicking the X
    closeBtn.addEventListener('click', () => {
      modal.style.display = 'none';
      document.body.style.overflow = 'visible';
    });

    // Close modal when clicking outside the image (on the dark background)
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.style.display = 'none';
        document.body.style.overflow = 'visible';
      }
    });

    // Optional: Close with Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.style.display === 'flex') {
        modal.style.display = 'none';
        document.body.style.overflow = 'visible';
      }
    });
  </script>

</body>
</html>

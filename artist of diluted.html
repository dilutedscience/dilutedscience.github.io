<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Diluted Science Artists</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f0f0f;
      color: #e0e0e0;
    }
    header {
      background: linear-gradient(to right, #1a1a2e, #16213e);
      padding: 60px 20px;
      text-align: center;
      border-bottom: 4px solid #00d4ff;
    }
    header h1 {
      margin: 0;
      font-size: 3.2rem;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    header p {
      margin: 10px 0 0;
      font-size: 1.3rem;
      opacity: 0.9;
    }
    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
    }
    .artist-card {
      background: #1e1e2e;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      text-align: center;
    }
    .artist-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 15px 35px rgba(0, 212, 255, 0.3);
    }
    .artist-card img {
      width: 100%;
      height: 420px;
      object-fit: cover;
      display: block;
    }
    .artist-card h2 {
      margin: 35px 15px 30px;
      font-size: 1.6rem;
      color: #00d4ff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    footer {
      text-align: center;
      padding: 30px;
      background: #0a0a0a;
      font-size: 0.95rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <header>
    <h1>Diluted Science</h1>
    <p>Collective of visionary artists pushing boundaries</p>
  </header>

  <div class="container">
    <div class="gallery">

      <div class="artist-card">
        <img src="BBD.jpg" alt="BBD">
        <h2>BBD</h2>
      </div>

      <div class="artist-card">
        <img src="andy b.jpg" alt="Andy B"> <!-- placeholder portrait-style -->
        <h2>Andy B</h2>
      </div>

      <div class="artist-card">
        <img src="west bird.jpg" alt="West Bird">
        <h2>West Bird</h2>
      </div>

      <div class="artist-card">
        <img src="Adam.png" alt="Adam">
        <h2>Adam</h2>
      </div>

      <div class="artist-card">
        <img src="george w.jpg"> <!-- placeholder abstract/art -->
        <h2>George Winters</h2>
      </div>

      <div class="artist-card">
        <img src="Q.jpg" alt="Q">
        <h2>Q</h2>
      </div>

      <div class="artist-card">
        <img src="TONE.png" alt="TONE">
        <h2>TONE</h2>
      </div>

      <div class="artist-card">
        <img src="JACK.png" alt="JACK">
        <h2>JACK</h2>
      </div>

      <div class="artist-card">
        <img src="CXLXRADX.jpg" alt="CXLXRADX"> <!-- placeholder futuristic/graphic -->
        <h2>CXLXRADX</h2>
      </div>

    </div>
  </div>

  <footer>
    © 2026 Diluted Science • <a href="https://x.com/dilutedscience" style="color: #00d4ff; text-decoration: none;">@dilutedscience</a>
  </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Diluted Science - Artists</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f0f1a;
      color: #e0e0ff;
    }
    header {
      background: linear-gradient(to bottom, #1a1a3d, #0d0d1f);
      text-align: center;
      padding: 60px 20px 40px;
    }
    h1 {
      margin: 0;
      font-size: 3.2rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #a78bfa;
      text-shadow: 0 0 20px rgba(167, 139, 250, 0.6);
    }
    .subtitle {
      margin-top: 12px;
      font-size: 1.3rem;
      color: #b0b0ff;
      opacity: 0.9;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .artists-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 40px 30px;
    }
    .artist-card {
      background: #1a1a2e;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      text-align: center;
    }
    .artist-card:hover {
      transform: translateY(-12px);
      box-shadow: 0 20px 50px rgba(167, 139, 250, 0.3);
    }
    .artist-card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
    }
    .artist-name {
      padding: 20px 15px;
      font-size: 1.5rem;
      font-weight: bold;
      color: #c4b5fd;
      background: linear-gradient(to top, #0f0f1f, transparent);
    }
    footer {
      text-align: center;
      padding: 30px;
      font-size: 0.95rem;
      color: #8888aa;
      border-top: 1px solid #2a2a4a;
    }
  </style>
</head>
<body>

  <header>
    <h1>Diluted Science</h1>
    <p class="subtitle">Featured Artists</p>
  </header>

  <div class="container">
    <div class="artists-grid">

      <div class="artist-card">
        <img src="BBD.jpg>
        <div class="artist-name">BBD</div>
      </div>

      <div class="artist-card">
        <img src="andy b.jpg">
        <div class="artist-name">Andy B</div>
      </div>

      <div class="artist-card">
        <img src="westbird.jpg">
        <div class="artist-name">West Bird</div>
      </div>

      <div class="artist-card">
        <img src="George winters.jpg">
        <div class="artist-name">George Winters</div>
      </div>

      <div class="artist-card">
        <img src="Q.jpg">
        <div class="artist-name">Q</div>
      </div>

    </div>
  </div>

  <footer>
    <p>&copy; 2026 Diluted Science • All rights reserved • @dilutedscience</p>
  </footer>

</body>
</html>

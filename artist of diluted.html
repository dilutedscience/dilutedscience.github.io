<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Diluted Science - Artists</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f0f1a;
      color: #e0e0ff;
      margin: 0;
      padding: 0;
    }
    header {
      background: linear-gradient(to right, #1a1a3d, #2a1a5d);
      text-align: center;
      padding: 60px 20px;
    }
    h1 {
      margin: 0;
      font-size: 3.5em;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .tagline {
      font-size: 1.3em;
      margin-top: 10px;
      opacity: 0.9;
    }
    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .artists-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
    }
    .artist-card {
      background: #1e1e38;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      text-align: center;
    }
    .artist-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 15px 30px rgba(100, 80, 200, 0.4);
    }
    .artist-card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
    }
    .artist-name {
      padding: 20px;
      font-size: 1.5em;
      font-weight: bold;
      background: #2a2a4a;
    }
    footer {
      text-align: center;
      padding: 30px;
      background: #0a0a1a;
      font-size: 0.9em;
      margin-top: 60px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Diluted Science</h1>
    <p class="tagline">A collective of visionary artists pushing boundaries in sound, vision, and creativity</p>
  </header>

  <div class="container">
    <div class="artists-grid">

      <div class="artist-card">
        <img src="BBD.jpg">
        <div class="artist-name">BBD</div>
      </div>

      <div class="artist-card">
        <img src="andy b.jpg">
        <div class="artist-name">Andy B</div>
      </div>

      <div class="artist-card">
        <img src="west bird.jpg">
        <div class="artist-name">West Bird</div>
      </div>

      <div class="artist-card">
        <img src="Adam.png">
        <div class="artist-name">Adam</div>
      </div>

      <div class="artist-card">
        <img src="george w.jpg">
        <div class="artist-name">George Winters</div>
      </div>

      <div class="artist-card">
        <img src="Q.jpg">
        <div class="artist-name">Q</div>
      </div>

    </div>
  </div>

  <footer>
    <p>&copy; 2026 Diluted Science | Music Production Studio | <a href="mailto:dilutedscience@gmail.com" style="color: #a0a0ff;">dilutedscience@gmail.com</a></p>
  </footer>

</body>
</html>

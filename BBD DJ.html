<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BBD DJ - Video Stories</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0f0f0f;
      color: #e0e0e0;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 30px 20px;
    }
    header {
      text-align: center;
      padding: 30px 0 40px;
    }
    h1 {
      margin: 0;
      font-size: 2.8rem;
      color: #ff3366;
      text-shadow: 0 0 20px rgba(255, 51, 102, 0.5);
    }
    .subtitle {
      margin: 12px 0 0;
      font-size: 1.2rem;
      color: #aaa;
    }
    .videos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin: 20px 0 60px;
    }
    .video-section {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .video-section h2 {
      margin: 0 0 16px 0;
      color: #ffcc00;
      font-size: 1.5rem;
    }
    video {
      width: 100%;
      height: auto;
      border-radius: 8px;
      background: #000;
    }
    footer {
      text-align: center;
      padding: 40px 0;
      color: #666;
      font-size: 0.95rem;
    }
    @media (max-width: 900px) {
      .videos {
        grid-template-columns: 1fr;
        gap: 60px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>BBD DJ</h1>
      <div class="subtitle">Vibes • Stories • You</div>
    </header>

    <div class="videos">
      <div class="video-section">
        <h2>Story</h2>
        <video controls preload="metadata" poster="">
          <source src="story.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>

      <div class="video-section">
        <h2>You</h2>
        <video controls preload="metadata" poster="">
          <source src="you.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>
    </div>

    <footer>
      <p>Powered by BBD DJ • 2025–2026</p>
    </footer>
  </div>

</body>
</html>

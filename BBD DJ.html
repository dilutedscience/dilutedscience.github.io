<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BBD DJ - Video Mix</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #0f0f0f;
      color: #e0e0e0;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #ff3366;
      margin-bottom: 10px;
    }
    .subtitle {
      color: #bbb;
      margin-bottom: 30px;
    }
    video {
      width: 100%;
      max-width: 880px;
      background: #000;
      border: 2px solid #333;
      border-radius: 8px;
      margin: 20px auto;
      display: block;
    }
    .playlist {
      max-width: 880px;
      margin: 0 auto 40px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .track-btn {
      background: #1a1a1a;
      color: #fff;
      border: 1px solid #444;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1.05rem;
      transition: all 0.2s;
      min-width: 140px;
    }
    .track-btn:hover {
      background: #333;
      border-color: #ff3366;
      transform: translateY(-2px);
    }
    .track-btn.active {
      background: #ff3366;
      border-color: #ff6699;
      color: white;
      font-weight: bold;
    }
    footer {
      margin-top: 60px;
      color: #555;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <h1>BBD DJ</h1>
  <div class="subtitle">Select a track to play</div>

  <video id="player" controls autoplay muted>
    <source src="story.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <div class="playlist">
    <button class="track-btn active" data-src="story.mp4">story</button>
    <button class="track-btn" data-src="you.mp4">you</button>
    <button class="track-btn" data-src="5.mp4">5</button>
    <button class="track-btn" data-src="DJ.mp4">DJ</button>
    <button class="track-btn" data-src="nf.mp4">nf</button>
    <button class="track-btn" data-src="slip.mp4">slip</button>
    <button class="track-btn" data-src="sul.mp4">sul</button>
    <button class="track-btn" data-src="war.mp4">war</button>
    <button class="track-btn" data-src="whoo.mp4">whoo</button>
  </div>

  <footer>
    Place all .mp4 files in the same folder as this HTML file<br>
    Best viewed in modern browsers • Mobile friendly
  </footer>

  <script>
    const player = document.getElementById('player');
    const buttons = document.querySelectorAll('.track-btn');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        // Remove active from all buttons
        buttons.forEach(b => b.classList.remove('active'));
        // Add active to clicked button
        btn.classList.add('active');

        const src = btn.getAttribute('data-src');
        player.src = src;
        player.play().catch(() => {
          // Autoplay may be blocked → user will need to click play
        });
      });
    });
  </script>

</body>
</html>

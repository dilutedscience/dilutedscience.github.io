<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BBD DJ - Video Player</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #0f0f0f;
      color: #e0e0e0;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #ff3366;
      margin-bottom: 30px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    .player-box {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.7);
    }
    video {
      width: 100%;
      max-height: 540px;
      background: black;
      border-radius: 8px;
    }
    .playlist {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    .track-btn {
      background: #222;
      border: 2px solid #444;
      color: white;
      padding: 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.2s;
      text-align: center;
    }
    .track-btn:hover {
      background: #ff3366;
      border-color: #ff3366;
      transform: translateY(-2px);
    }
    .track-btn.active {
      background: #ff3366;
      border-color: #ff6699;
      box-shadow: 0 0 15px rgba(255,51,102,0.6);
    }
    footer {
      text-align: center;
      margin-top: 40px;
      color: #777;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>BBD DJ - Available for Parties, Weddings, or Corporate parties</h1>

  <div class="player-box">
    <video id="videoPlayer" controls autoplay muted>
      <source src="story.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>

  <div class="playlist">
    <button class="track-btn active" onclick="playVideo('story.mp4', this)">story.mp4</button>
    <button class="track-btn" onclick="playVideo('you.mp4', this)">you.mp4</button>
    <button class="track-btn" onclick="playVideo('5.mp4', this)">5.mp4</button>
    <button class="track-btn" onclick="playVideo('DJ.mp4', this)">DJ.mp4</button>
    <button class="track-btn" onclick="playVideo('nf.mp4', this)">nf.mp4</button>
    <button class="track-btn" onclick="playVideo('slip.mp4', this)">slip.mp4</button>
    <button class="track-btn" onclick="playVideo('sul.mp4', this)">sul.mp4</button>
    <button class="track-btn" onclick="playVideo('war.mp4', this)">war.mp4</button>
    <button class="track-btn" onclick="playVideo('whoo.mp4', this)">whoo.mp4</button>
  </div>

  <footer>
    BBD DJ • Just click a track to play • Videos play in the player above
  </footer>
</div>

<script>
  const video = document.getElementById('videoPlayer');
  let currentButton = document.querySelector('.track-btn.active');

  function playVideo(filename, button) {
    // Remove active from previous button
    if (currentButton) {
      currentButton.classList.remove('active');
    }
    
    // Set new active button
    button.classList.add('active');
    currentButton = button;

    // Change video source and play
    video.src = filename;
    video.play().catch(err => {
      console.log("Autoplay prevented:", err);
      // Most browsers require user interaction for sound
    });
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DilutedScience</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacOSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    .hero {
      position: relative;
      height: 100vh;
      width: 100%;
      background: #0f0f0f;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("dilutedscience logo.jpg");
      background-size: cover;           /* this is the "object-fit: cover" equivalent for backgrounds */
      background-position: center;
      background-repeat: no-repeat;
      z-index: 1;
      opacity: 0.85;                    /* slight darkening – adjust or remove as needed */
    }

    /* Optional: dark overlay for better text readability */
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 2;
    }

    .content {
      position: relative;
      z-index: 3;
      padding: 2rem;
      max-width: 900px;
    }

    h1 {
      font-size: clamp(3.5rem, 8vw, 9rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      margin-bottom: 1.2rem;
      text-shadow: 0 4px 20px rgba(0,0,0,0.7);
    }

    p {
      font-size: clamp(1.3rem, 4vw, 1.8rem);
      max-width: 640px;
      opacity: 0.95;
      line-height: 1.45;
      margin-bottom: 2.5rem;
    }

    .btn {
      display: inline-block;
      padding: 1rem 2.2rem;
      background: #ffffff;
      color: #111;
      font-weight: bold;
      text-decoration: none;
      border-radius: 50px;
      font-size: 1.2rem;
      transition: all 0.25s ease;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.55);
      background: #f0f0f0;
    }
  </style>
</head>
<body>

  <div class="hero">
    <div class="content">
      <h1>Diluted Science</h1>
      <p>
        Where complex ideas meet elegant simplicity.<br>
        Exploring the boundaries between signal and noise.
      </p>
      <a href="lab.html" class="btn">Enter the Lab</a>
      </p>
      <a href="lab.html" class="btn">Artists of Diluted Science</a>
    </div>
  </div>

</body>
</html>

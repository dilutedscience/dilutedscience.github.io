<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DilutedScience</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacOSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    .hero {
      position: relative;
      height: 100vh;
      width: 100%;
      background: #0f0f0f;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("dilutedscience logo.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 1;
      opacity: 0.85;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 2;
    }

    .content {
      position: relative;
      z-index: 3;
      padding: 2rem;
      max-width: 900px;
    }

    h1 {
      font-size: clamp(3.5rem, 8vw, 9rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      margin-bottom: 1.2rem;
      
      background: linear-gradient(90deg, #39ff14, #cc00ff, #39ff14);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      
      text-shadow: 
        0 0 8px #ffffff,
        0 0 16px #ffffff,
        0 0 24px #39ff14,
        0 0 48px #39ff14,
        0 0 72px #39ff14,
        0 0 24px #cc00ff,
        0 0 48px #cc00ff,
        0 0 72px #cc00ff,
        0 0 96px #cc00ff;
      
      animation: neon-flicker 1.8s ease-in-out infinite alternate;
    }

    @keyframes neon-flicker {
      0% { text-shadow: 0 0 8px #ffffff, 0 0 16px #ffffff, 0 0 24px #39ff14, 0 0 48px #39ff14, 0 0 72px #39ff14, 0 0 24px #cc00ff, 0 0 48px #cc00ff, 0 0 72px #cc00ff, 0 0 96px #cc00ff; }
      100% { text-shadow: 0 0 4px #ffffff, 0 0 10px #ffffff, 0 0 18px #39ff14, 0 0 36px #39ff14, 0 0 60px #39ff14, 0 0 18px #cc00ff, 0 0 36px #cc00ff, 0 0 60px #cc00ff, 0 0 80px #cc00ff; }
    }

    p {
      font-size: clamp(1.3rem, 4vw, 1.8rem);
      max-width: 640px;
      opacity: 0.95;
      line-height: 1.45;
      margin-bottom: 2.5rem;
      text-align: center;           /* ← EXPLICIT CENTER (this is what you asked for) */
      margin-left: auto;
      margin-right: auto;
    }

    .btn {
      display: inline-block;
      padding: 1rem 2.2rem;
      background: #ffffff;
      color: #111;
      font-weight: bold;
      text-decoration: none;
      border-radius: 50px;
      font-size: 1.2rem;
      transition: all 0.25s ease;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      margin: 0.8rem 0.6rem;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.55);
      background: #f0f0f0;
    }

    /* SOCIAL BANNER */
    .social-banner {
      background: #000000;
      padding: 14px 0;
      text-align: center;
      border-top: 1px solid #1a1a1a;
      border-bottom: 1px solid #1a1a1a;
    }

    .social-icons {
      display: inline-flex;
      gap: 24px;
      align-items: center;
    }

    .social-link {
      color: #39ff14;
      font-size: 28px;
      text-decoration: none;
      transition: all 0.3s ease;
      display: inline-block;
      line-height: 1;
    }

    .social-link:hover,
    .social-link:focus {
      color: #7fff00;
      transform: scale(1.25);
      filter: drop-shadow(0 0 8px #39ff14) drop-shadow(0 0 15px #39ff14);
      outline: none;
    }

    @media (max-width: 480px) {
      .social-icons { gap: 20px; }
      .social-link { font-size: 26px; }
    }
  </style>
</head>

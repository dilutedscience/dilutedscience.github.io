<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Diluted Science</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f0f1a;
            color: #e0e0ff;
            font-family: system-ui, -apple-system, sans-serif;
        }
        
        h1 {
            font-size: 9vw;          /* scales with viewport width */
            font-weight: 800;
            letter-spacing: -0.04em;
            margin: 0;
            text-align: center;
            background: linear-gradient(90deg, #a78bfa, #7dd3fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(167, 139, 250, 0.4);
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 14vw;
            }
        }
    </style>
</head>
<body>
    <h1>Diluted Science</h1>
</body>
</html>
